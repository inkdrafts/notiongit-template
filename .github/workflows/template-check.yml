name: Template checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run hygiene fixture tests
        run: ./scripts/test-hygiene.sh

      - name: Check template hygiene
        run: ./scripts/check-hygiene.sh

      - name: Check neutral configuration
        run: ./scripts/check-neutral-config.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
